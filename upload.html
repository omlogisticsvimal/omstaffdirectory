<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Upload | OM Directory</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { 
            background-color: #f4f6fb; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
        }
        .upload-card { 
            background: #fff; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
        }
        .drop-zone { 
            border: 2px dashed #3b3086; 
            border-radius: 12px; 
            padding: 30px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            background: #f8f9fa; 
        }
        .drop-zone:hover { 
            background: #e2e8f0; 
            border-color: #2d236e; 
        }
        #uploadStatus { 
            margin-top: 15px; 
            font-weight: 600; 
        }
    </style>
</head>
<body>

    <div class="upload-card">
        <h3 class="mb-3 text-primary"><i class="fa-solid fa-cloud-upload-alt me-2"></i>Bulk Excel Upload</h3>
        <p class="text-muted small">Upload your formatted Excel file. <strong>Existing EMP IDs will be UPDATED with new details.</strong></p>
        
        <label for="excelFileInput" class="drop-zone w-100 d-block mt-3">
            <i class="fa-solid fa-file-excel fa-3x text-success mb-2"></i>
            <div class="fw-bold">Click to Select Excel File</div>
            <div class="text-muted small">(.xlsx, .xls)</div>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
        </label>

        <div id="uploadStatus" class="text-muted">Waiting for file...</div>
        
        <button class="btn btn-outline-secondary mt-3 w-100" onclick="window.location.href='dashboard.html'">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </button>
    </div>

    <!-- CDN Script Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        if (typeof XLSX === 'undefined') {
            document.getElementById('uploadStatus').innerHTML = `<span class="text-danger fw-bold">❌ Error: XLSX library failed to load. Please refresh.</span>`;
            throw new Error("XLSX library not loaded");
        }

        const SUPABASE_URL = "https://npiketzhgsckkacbxxqb.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5waWtldHpoZ3Nja2thY2J4eHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzY5MTYsImV4cCI6MjEwMTYxMjkxNn0.QeXDPFLKiFgbBYJ1nGY4Hw17LJba53-4hD7cYfoaf10";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML = `<span class="text-primary"><i class="fa-solid fa-spinner fa-spin me-1"></i> Parsing Excel file... Please wait.</span>`;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let allExtractedStaff = [];

                    // 1. Excel Parsing
                    for (let s = 0; s < workbook.SheetNames.length; s++) {
                        const sheetName = workbook.SheetNames[s];
                        const ws = workbook.Sheets[sheetName];
                        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                        if (!rows || rows.length === 0) continue;

                        let headerRowIndex = -1;
                        for (let i = 0; i < Math.min(rows.length, 10); i++) {
                            const rowStr = rows[i].map(cell => String(cell).trim()).join(" ");
                            if (rowStr.includes("EMP. CODE") && rowStr.includes("OFFICIAL")) {
                                headerRowIndex = i;
                                break;
                            }
                        }
                        if (headerRowIndex === -1) continue;

                        const headers = rows[headerRowIndex].map(h => String(h).trim());
                        
                        const idxCompany = headers.findIndex(h => h.toUpperCase() === "COMPANY");
                        const idxLocation = headers.findIndex(h => h.toUpperCase() === "STATE/ BRANCH");
                        const idxAddress = headers.findIndex(h => h.toUpperCase() === "ADDRESS");
                        const idxBranchCode = headers.findIndex(h => h.toUpperCase() === "BRANCH CODE");
                        const idxEmpCode = headers.findIndex(h => h.toUpperCase() === "EMP. CODE");
                        const idxName = headers.findIndex(h => h.toUpperCase() === "OFFICIAL");
                        const idxDesig = headers.findIndex(h => h.toUpperCase() === "DESIGNATION/ DEPARMENT");
                        const idxMobile = headers.findIndex(h => h.toUpperCase() === "CONTACT NO.");
                        const idxEmail = headers.findIndex(h => h.toUpperCase() === "E-MAIL");

                        let currentCompany = "", currentLocation = "", currentAddress = "", currentBranchCode = "";

                        for (let r = headerRowIndex + 1; r < rows.length; r++) {
                            const row = rows[r];
                            if (!row || row.length === 0) continue;

                            let empId = idxEmpCode !== -1 ? String(row[idxEmpCode] || "").trim() : "";
                            let name = idxName !== -1 ? String(row[idxName] || "").trim() : "";

                            if (!empId && name) {
                                if (idxCompany !== -1) currentCompany = String(row[idxCompany] || "").trim();
                                if (idxLocation !== -1) currentLocation = String(row[idxLocation] || "").trim();
                                if (idxAddress !== -1) currentAddress = String(row[idxAddress] || "").trim();
                                if (idxBranchCode !== -1) currentBranchCode = String(row[idxBranchCode] || "").trim();
                                continue;
                            }

                            if (!name || !empId) continue;

                            let company = idxCompany !== -1 ? String(row[idxCompany] || "").trim() : currentCompany;
                            let location = idxLocation !== -1 ? String(row[idxLocation] || "").trim() : currentLocation;
                            let address = idxAddress !== -1 ? String(row[idxAddress] || "").trim() : currentAddress;
                            let branchCode = idxBranchCode !== -1 ? String(row[idxBranchCode] || "").trim() : currentBranchCode;
                            let designation = idxDesig !== -1 ? String(row[idxDesig] || "").trim() : "STAFF";
                            let mobile = idxMobile !== -1 ? String(row[idxMobile] || "").trim() : "";
                            let email = idxEmail !== -1 ? String(row[idxEmail] || "").trim() : "";

                            allExtractedStaff.push({
                                empid: empId,
                                name: name.toUpperCase(),
                                company: company || "N/A",
                                location: location || "N/A",
                                address: address || "N/A",
                                branchcode: branchCode || "N/A",
                                designation: designation,
                                mobile: mobile || "N/A",
                                email: email || "N/A"
                            });
                        }
                    }

                    if (allExtractedStaff.length === 0) {
                        statusDiv.innerHTML = `<span class="text-danger">❌ No valid staff records found in the Excel file.</span>`;
                        return;
                    }

                    // 2. Remove duplicate EMP IDs inside the file itself (keep latest record)
                    const uniqueStaffMap = new Map();
                    allExtractedStaff.forEach(item => uniqueStaffMap.set(item.empid, item));
                    const uniqueStaffRecords = Array.from(uniqueStaffMap.values());
                    const insideFileDuplicates = allExtractedStaff.length - uniqueStaffRecords.length;

                    statusDiv.innerHTML = `<span class="text-warning"><i class="fa-solid fa-spinner fa-spin me-1"></i> Syncing ${uniqueStaffRecords.length} records with Supabase...</span>`;

                    // 3. Native Upsert in Batches (Automatic Insert/Update based on empid conflict)
                    const chunkSize = 200;
                    let processedCount = 0;

                    for (let i = 0; i < uniqueStaffRecords.length; i += chunkSize) {
                        const chunk = uniqueStaffRecords.slice(i, i + chunkSize);

                        const { error } = await supabaseClient
                            .from('staff')
                            .upsert(chunk, { onConflict: 'empid' });

                        if (error) {
                            throw error;
                        }

                        processedCount += chunk.length;
                        statusDiv.innerHTML = `<span class="text-primary"><i class="fa-solid fa-spinner fa-spin me-1"></i> Processed ${processedCount}/${uniqueStaffRecords.length} records...</span>`;
                    }

                    // 4. Success UI
                    statusDiv.innerHTML = `
                        <div class="alert alert-success mt-3 shadow-sm text-start">
                            <h6 class="fw-bold text-success mb-2"><i class="fa-solid fa-circle-check me-1"></i> Sync Completed Successfully!</h6>
                            <div class="small">
                                <div class="d-flex justify-content-between border-bottom pb-1 mb-1">
                                    <span>Total File Records Processed:</span>
                                    <span class="fw-bold text-primary">${uniqueStaffRecords.length}</span>
                                </div>
                                <div class="d-flex justify-content-between border-bottom pb-1 mb-1">
                                    <span>Status:</span>
                                    <span class="fw-bold text-success">Inserted / Updated Automatically</span>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span>Duplicate Rows Skipped (In Excel):</span>
                                    <span class="fw-bold text-secondary">${insideFileDuplicates}</span>
                                </div>
                            </div>
                        </div>
                    `;

                } catch (err) {
                    console.error("Upload Error:", err);
                    statusDiv.innerHTML = `
                        <div class="alert alert-danger mt-3 shadow-sm text-start">
                            <h6 class="fw-bold text-danger mb-1"><i class="fa-solid fa-circle-exclamation me-1"></i> Upload Failed</h6>
                            <div class="small">${err.message || 'Unknown error occurred'}</div>
                        </div>
                    `;
                } finally {
                    event.target.value = "";
                }
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
