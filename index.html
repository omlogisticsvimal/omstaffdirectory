<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OM Directory | Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #2d236e 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background-color: #3b3086;
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 1.8rem;
        }

        .btn-login {
            background-color: #3b3086;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
        }

        .btn-login:hover {
            background-color: #2b236d;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="brand-icon">
            <i class="fa-solid fa-address-book"></i>
        </div>
        <h4 class="fw-bold mb-1 text-dark">OM Directory</h4>
        <p class="text-muted small mb-4">Sign in to access admin panel</p>

        <form onsubmit="event.preventDefault(); handleLogin();">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-secondary">USERNAME</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-secondary">PASSWORD</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>

            <div id="msg" class="small fw-bold mb-3"></div>

            <button type="submit" class="btn btn-login">
                Login <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
        </form>
    </div>

    <!-- Supabase CDN Script Loaded FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Embedded Login Logic -->
    <script>
        const SUPABASE_URL = "https://npiketzhgsckkacbxxqb.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5waWtldHpoZ3Nja2thY2J4eHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzY5MTYsImV4cCI6MjEwMTYxMjkxNn0.QeXDPFLKiFgbBYJ1nGY4Hw17LJba53-4hD7cYfoaf10";

        let supabaseClient;
        
        // Ensure Supabase initializes correctly
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // Auto-redirect if already logged in
        if (localStorage.getItem("login") === "yes") {
            window.location.href = "dashboard.html";
        }

        async function handleLogin() {
            let u = document.getElementById("username").value.trim();
            let p = document.getElementById("password").value.trim();
            let msgEl = document.getElementById("msg");

            if (!supabaseClient) {
                msgEl.style.color = "#dc2626";
                msgEl.innerText = "Supabase SDK library not loaded. Check connection!";
                return;
            }

            msgEl.style.color = "#2563eb";
            msgEl.innerText = "Checking credentials...";

            try {
                // REST API direct call fallback if SDK client faces network issues
                const response = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=*&password=eq.${encodeURIComponent(p)}`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (response.ok) {
                    const users = await response.json();
                    // Match username (case insensitive)
                    const matchedUser = users.find(user => user.username.toLowerCase() === u.toLowerCase());

                    if (matchedUser) {
                        localStorage.setItem("login", "yes");
                        localStorage.setItem("currentUser", matchedUser.username);
                        localStorage.setItem("userRole", matchedUser.role || "User");

                        window.location.href = "dashboard.html";
                    } else {
                        msgEl.style.color = "#dc2626";
                        msgEl.innerText = "Invalid Username or Password!";
                    }
                } else {
                    msgEl.style.color = "#dc2626";
                    msgEl.innerText = "Database connection error!";
                }

            } catch (err) {
                console.error("Login Error:", err);
                msgEl.style.color = "#dc2626";
                msgEl.innerText = "Connection failed. Please refresh and try again!";
            }
        }
    </script>
</body>
</html>
