<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Users | OM Directory</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { 
            background-color: #f4f6fb; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
        }

        /* 🟢 Main Container */
        .main-card { 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 24px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
            border: 1px solid #e9eef3;
        }

        /* 🟢 Header Styling */
        .header-title { font-size: 1.6rem; font-weight: 700; color: #111827; }
        .header-title i { color: #1e293b; }
        
        .live-badge { 
            background: #d1fae5; color: #065f46; 
            padding: 5px 14px; border-radius: 30px; 
            font-weight: 600; font-size: 0.75rem; 
        }
        .live-badge i { font-size: 0.4rem; animation: blink 1.5s infinite; margin-right: 4px;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        .btn-back { 
            background: #3b3086; color: white; border: none; 
            padding: 6px 18px; border-radius: 30px; 
            font-weight: 600; font-size: 0.85rem; transition: 0.2s; 
        }
        .btn-back:hover { background: #2d236e; color: white; }

        /* 🟢 Cards - FIXED ALIGNMENT */
        .stat-card { 
            border-radius: 12px; padding: 16px 20px; 
            text-align: center; color: white; 
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80px; /* Height ko thoda fix kiya taaki sab barabar dikhein */
        }
        .stat-number { font-size: 1.8rem; font-weight: 700; line-height: 1.2; margin-top: 2px; }
        .stat-label { font-size: 0.7rem; font-weight: 600; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .stat-label i { font-size: 0.65rem; }

        /* 🟢 Clean Table */
        .table-clean th {
            background: #ffffff; color: #6b7280; font-weight: 600; 
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid #e5e7eb; padding: 12px 10px;
        }
        .table-clean td {
            color: #1f2937; font-size: 0.9rem; padding: 14px 10px; 
            border-bottom: 1px solid #f3f4f6;
        }
        .table-clean tbody tr:last-child td { border-bottom: none; }
        
        .emp-badge { 
            background: #eef2ff; color: #4338ca; 
            padding: 4px 14px; border-radius: 30px; 
            font-weight: 600; font-size: 0.8rem; 
        }
        .status-active { 
            background: #d1fae5; color: #065f46; 
            padding: 4px 14px; border-radius: 30px; 
            font-weight: 600; font-size: 0.75rem; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-active i { font-size: 0.4rem; }

        .table-footer { 
            background: #fafbfc; color: #6b7280; 
            font-size: 0.8rem; padding: 12px 10px; 
            border-top: 1px solid #e5e7eb; margin-top: 5px;
        }

        @media (max-width: 768px) {
            .header-title { font-size: 1.2rem; }
            .stat-number { font-size: 1.4rem; }
            .stat-card { min-height: 60px; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="container-fluid" style="max-width: 1100px;">

        <!-- 🟢 Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div class="header-title">
                <i class="fa-solid fa-users-viewfinder me-2"></i>Live Active Users
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="live-badge"><i class="fa-solid fa-circle"></i> Live</span>
                <button class="btn btn-back" onclick="window.location.href='dashboard.html'">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back
                </button>
            </div>
        </div>

        <!-- 🟢 Stats Cards (Perfect Alignment) -->
        <div class="row g-3 mb-4">
            <!-- Card 1: Purple (Active) -->
            <div class="col-md-4">
                <div class="stat-card" style="background: #2d236e;">
                    <div class="stat-label"><i class="fa-regular fa-circle-dot"></i> ACTIVE</div>
                    <div class="stat-number" id="liveCount">0</div>
                </div>
            </div>
            <!-- Card 2: Blue (Refresh) -->
            <div class="col-md-4">
                <div class="stat-card" style="background: #2c5282;">
                    <div class="stat-label"><i class="fa-regular fa-clock"></i> REFRESH</div>
                    <div class="stat-number" style="font-size: 1.2rem;">Realtime</div>
                </div>
            </div>
            <!-- Card 3: Green (Updated) -->
            <div class="col-md-4">
                <div class="stat-card" style="background: #276749;">
                    <div class="stat-label"><i class="fa-regular fa-calendar"></i> UPDATED</div>
                    <div class="stat-number" style="font-size: 1.2rem;" id="lastUpdated">--:--:--</div>
                </div>
            </div>
        </div>

        <!-- 🟢 Table -->
        <div class="main-card">
            <div class="table-responsive">
                <table class="table table-clean mb-0">
                    <thead>
                        <tr>
                            <th style="width: 50px;">#</th>
                            <th>Employee ID</th>
                            <th>User Name</th>
                            <th>Last Active</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="liveUsersTableBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                <i class="fa-solid fa-spinner fa-spin me-2"></i> Connecting to live stream...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- 🟢 Table Footer -->
            <div class="table-footer" id="tableFooter">
                Showing 0 users
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 🟢 Security Check
        const userRole = localStorage.getItem("userRole");
        if (!userRole || userRole.toLowerCase().trim() !== "admin") {
            alert("⚠️ Access Denied! Admins only.");
            window.location.href = "dashboard.html";
        }

        const supabaseClient = supabase.createClient(
            "https://npiketzhgsckkacbxxqb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5waWtldHpoZ3Nja2thY2J4eHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMzY5MTYsImV4cCI6MjEwMTYxMjkxNn0.QeXDPFLKiFgbBYJ1nGY4Hw17LJba53-4hD7cYfoaf10"
        );

        async function fetchLiveUsers() {
            try {
                const twoMinutesAgo = new Date(Date.now() - 2 * 60 * 1000).toISOString();
                const { data, error } = await supabaseClient
                    .from('user_sessions')
                    .select('*')
                    .gte('last_ping_time', twoMinutesAgo)
                    .order('last_ping_time', { ascending: false });

                if (error) throw error;

                const tbody = document.getElementById('liveUsersTableBody');
                const countEl = document.getElementById('liveCount');
                const footerEl = document.getElementById('tableFooter');

                if (!data || data.length === 0) {
                    countEl.innerText = "0";
                    footerEl.innerText = "Showing 0 users";
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                <i class="fa-regular fa-face-meh me-2"></i> No active users right now.
                            </td>
                        </tr>
                    `;
                } else {
                    countEl.innerText = data.length;
                    footerEl.innerText = `Showing 1-${data.length} of ${data.length} users`;
                    
                    let html = '';
                    data.forEach((user, index) => {
                        const lastActive = new Date(user.last_ping_time);
                        const timeAgo = Math.floor((Date.now() - lastActive.getTime()) / 1000);
                        let timeString = "Just now";
                        if (timeAgo > 60) timeString = Math.floor(timeAgo / 60) + "m ago";

                        html += `
                            <tr>
                                <td class="text-muted">${index + 1}</td>
                                <td><span class="emp-badge">${user.empid}</span></td>
                                <td class="fw-bold">${user.user_name || 'N/A'}</td>
                                <td class="text-muted">${timeString}</td>
                                <td><span class="status-active"><i class="fa-solid fa-circle"></i> Active</span></td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;
                }

                // Update time in the green card
                document.getElementById('lastUpdated').innerText = new Date().toLocaleTimeString();

            } catch (err) {
                console.error("Error fetching live users:", err);
                document.getElementById('liveUsersTableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-danger py-4">
                            <i class="fa-solid fa-triangle-exclamation me-2"></i> Connection error.
                        </td>
                    </tr>
                `;
            }
        }

        // 1. Load instantly
        fetchLiveUsers();

        // 2. 🔥 Supabase Realtime Live Connection (Bina refresh ke)
        supabaseClient
            .channel('live_users_sync')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'user_sessions' }, () => fetchLiveUsers())
            .subscribe();

        console.log("✅ Real-time live stream connected.");
    </script>
</body>
</html>
